[package]
name = "sentin8-post"
version = "1.0.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Sentin8/sentin8-post"
rust-version = "1.85"
description = "Sentin8 Sentin8:Post - multi-channel message delivery service."

[[bin]]
name = "sentin8-post"
path = "src/main.rs"

[lib]
name = "sentin8_post_server"
path = "src/lib.rs"

[dependencies]
# THE SDK pin (RS 2.3) - the only cross-repo dependency. It carries the
# entire shared library workspace (core/identity/tls/bus/shield/shell +
# every post-client/contracts SDK crate) behind the `sentin8` facade.
sentin8 = { git = "https://github.com/Sentin8/sentin8-sdk", tag = "sdk-v1.0.0" }

axum = { version = "0.8", features = ["macros"] }
tokio = { version = "1", features = ["full"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.7", features = ["trace", "cors", "compression-gzip", "limit"] }
hyper = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "tls-native-tls", "postgres", "uuid", "chrono", "json", "macros"] }
dotenvy = "0.15"
uuid = { version = "1", features = ["v4", "v5", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1"
anyhow = "1"
utoipa = { version = "5", features = ["chrono", "uuid"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls-native-roots-no-provider", "json"], default-features = false }
sentin8-secrets-sdk = { git = "https://github.com/Sentin8/sentin8-secrets", tag = "secrets-sdk-v1.0.0" }

# Dev-tree SDK override (temporary local iteration) - resolve the SDK from
# the sibling checkout so cross-crate changes are testable before a tag.
[patch."https://github.com/Sentin8/sentin8-sdk"]
sentin8 = { path = "../sentin8-sdk/facade" }
sentin8-middleware = { path = "../sentin8-sdk/core/middleware" }
sentin8-config = { path = "../sentin8-sdk/core/config" }
sentin8-registration = { path = "../sentin8-sdk/core/registration" }
sentin8-m2m = { path = "../sentin8-sdk/identity/m2m" }
sentin8-workload-registry = { path = "../sentin8-sdk/identity/workload-registry" }
sentin8-tls = { path = "../sentin8-sdk/tls/tls" }
sentin8-tls-contracts = { path = "../sentin8-sdk/tls/contracts" }
sentin8-auth-client = { path = "../sentin8-sdk/identity/auth-client" }
sentin8-shield = { path = "../sentin8-sdk/shield/shield" }
sentin8-bus-client = { path = "../sentin8-sdk/bus/client" }
sentin8-bus-contracts = { path = "../sentin8-sdk/bus/contracts" }
sentin8-outbox = { path = "../sentin8-sdk/bus/outbox" }
